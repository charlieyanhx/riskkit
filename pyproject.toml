[project]
name = "riskkit"
version = "0.3.0"
description = "Portfolio risk for a futures-and-options book: VaR/ES by four methods with full revaluation, a backtest suite with known size and power, stress and reverse stress, and explicit limit-down / empty-book / stale-quote semantics."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Hanxiong (Charlie) Yan" }]
dependencies = ["numpy>=1.26", "pandas>=2.1", "scipy>=1.11", "arch>=7"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff"]

[project.scripts]
riskkit = "riskkit.cli:main"

[project.urls]
Homepage = "https://github.com/charlieyanhx/riskkit"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/riskkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]
ignore = ["E501"]
